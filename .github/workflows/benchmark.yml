name: benchmark
# Every Monday, and on demand: move the benchmarked tools and projects to
# their latest release (bench/competitors.json), measure custos against them
# and open (or update) a pull request with the new numbers
# (bench/results.json, docs/guide/benchmark.md).
#
# The measure job runs third-party code (the tools, at versions bump may have
# just moved to, on cloned projects), so it gets a read-only token, keeps no
# git credentials, sees no secret and saves no Actions cache itself; the code
# it runs could still reach the job's cache token, so the workflows that
# publish (publish, release, docs) restore no cache. It hands the
# two data files to the publish job, which adopts only the bumped versions
# and tags and the measured numbers (benchcmp adopt refuses any other
# change and takes names from the trusted configuration), renders the page with
# this repository's own code and alone may open the pull request, to be
# reviewed before it is merged.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings. Pull requests opened with GITHUB_TOKEN do not
# trigger the ci workflow: set a BENCH_TOKEN secret (a token with contents and
# pull-requests write access) to have them checked.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: "Move tools and projects to their latest release first"
        type: boolean
        default: true
concurrency: benchmark
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          # Tags, so that the custos version reads vX.Y.Z(-N-gSHA).
          fetch-depth: 0
          persist-credentials: false
      # A cache this job saved could be restored by privileged runs (which
      # restore none anyway: see the comment at the top).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Phan needs ast (parser) and pcntl (parallel workers).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ast, pcntl
          ini-values: memory_limit=-1
          tools: composer
          coverage: none
      - run: make build
      - if: github.event_name == 'schedule' || inputs.bump
        run: go run ./tools/benchcmp bump
      - run: go run ./tools/benchcmp install
      - run: go run ./tools/benchcmp run
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            bench/competitors.json
            bench/results.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # From the measure job, adopt takes the versions and tags it measured
      # and the numbers of its measurements; corpus and tool names come from
      # the trusted configuration, and render escapes the remaining text.
      - uses: actions/download-artifact@v4
        with:
          name: benchmark
          path: ${{ runner.temp }}/benchmark
      - id: adopt
        run: |
          {
            echo "changes<<CHANGES"
            go run ./tools/benchcmp adopt \
              -from "$RUNNER_TEMP/benchmark/competitors.json" \
              -results-from "$RUNNER_TEMP/benchmark/results.json"
            echo "CHANGES"
          } >> "$GITHUB_OUTPUT"
      - run: go run ./tools/benchcmp render
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BENCH_TOKEN || secrets.GITHUB_TOKEN }}
          branch: bench/auto
          base: develop
          delete-branch: true
          add-paths: |
            bench/competitors.json
            bench/results.json
            docs/guide/benchmark.md
          commit-message: Update competitor benchmark
          title: Update competitor benchmark
          body: |
            Weekly run of the [benchmark workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Version changes:

            ```text
            ${{ steps.adopt.outputs.changes || 'none' }}
            ```
