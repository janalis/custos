name: docs
# Builds the documentation site (VitePress, docs/) and deploys it to GitHub
# Pages. Pull requests only build it (dead links and stale generated rule
# pages fail the build). The release workflow calls it after publishing so the
# changelog and version are current.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "specs/**"
      - "CHANGELOG.md"
      - "internal/inspection/meta/**"
      - "tools/rulesref/**"
      - "tools/internal/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "specs/**"
      - "CHANGELOG.md"
      - "internal/inspection/meta/**"
      - "tools/rulesref/**"
      - "tools/internal/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (the release tag)"
        type: string
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags for the version in the nav, history for "last updated".
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: generated docs are committed
        run: |
          go run ./tools/rulesref
          changed=$(git status --porcelain -- docs/rules docs/.vitepress/rules-sidebar.json)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::rule pages are stale: run make rules-doc and commit"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
